name: Update xmake-repo

on:
  workflow_dispatch:
    inputs:
      package_metadata:
        description: JSON package metadata from xmake.lua.
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
    - name: Notify xmake-repo
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.XMAKE_REPO_TOKEN }}
        repository: davidingplus/xmake-repo
        event-type: update-package
        client-payload: ${{ inputs.package_metadata }}
